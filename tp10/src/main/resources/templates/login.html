<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Connexion — Espace Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #2C687B 0%, #8CC7C4 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #FFF6F6;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(44, 104, 123, 0.3);
            padding: 50px 40px;
            width: 420px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 35px;
        }
        .login-header .logo {
            font-size: 50px;
            margin-bottom: 10px;
        }
        .login-header h2 {
            color: #2C687B;
            font-weight: 800;
            font-size: 26px;
        }
        .login-header p {
            color: #8CC7C4;
            font-size: 14px;
            margin-top: 5px;
        }
        .form-label {
            color: #2C687B;
            font-weight: 600;
            font-size: 14px;
        }
        .form-control {
            border: 2px solid #8CC7C4;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 15px;
            background: white;
        }
        .form-control:focus {
            border-color: #2C687B;
            box-shadow: 0 0 0 3px rgba(44, 104, 123, 0.15);
        }
        .btn-connexion {
            background: linear-gradient(135deg, #DB1A1A, #2C687B);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 13px;
            font-size: 16px;
            font-weight: 700;
            width: 100%;
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn-connexion:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(219, 26, 26, 0.3);
        }
        .alert-error {
            background-color: #fde8e8;
            border-left: 4px solid #DB1A1A;
            color: #DB1A1A;
            border-radius: 10px;
            padding: 12px 16px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .alert-success {
            background-color: #e8f5f4;
            border-left: 4px solid #2C687B;
            color: #2C687B;
            border-radius: 10px;
            padding: 12px 16px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .credentials-box {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin-top: 25px;
            border: 1px solid #8CC7C4;
        }
        .credentials-box p {
            margin: 0;
            font-size: 13px;
            color: #2C687B;
            font-weight: 600;
        }
        .credentials-box span {
            color: #DB1A1A;
            font-weight: 700;
        }
    </style>
</head>
<body>
<div class="login-card">
    <div class="login-header">
        <div class="logo">🏢</div>
        <h2>Espace Professionnel</h2>
        <p>Connectez-vous pour accéder à votre espace</p>
    </div>

    <!-- MESSAGE ERREUR -->
    <div class="alert-error" th:if="${param.erreur}">
        ❌ Identifiants incorrects, veuillez réessayer.
    </div>

    <!-- MESSAGE DECONNEXION -->
    <div class="alert-success" th:if="${param.deconnecte}">
        ✅ Vous êtes déconnecté avec succès.
    </div>

    <form th:action="@{/authenticate}" method="post">
        <div class="mb-3">
            <label class="form-label">👤 Nom d'utilisateur</label>
            <input type="text" name="username" class="form-control" placeholder="Entrez votre identifiant" required>
        </div>
        <div class="mb-4">
            <label class="form-label">🔒 Mot de passe</label>
            <input type="password" name="password" class="form-control" placeholder="Entrez votre mot de passe" required>
        </div>
        <button type="submit" class="btn-connexion">🔐 Se connecter</button>
    </form>

    <!-- CREDENTIALS HINT -->
    <div class="credentials-box">
        <p>🏢 Manager : <span>sara</span> / <span>manager123</span></p>
        <p>👷 Employé : <span>karim</span> / <span>employe123</span></p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
